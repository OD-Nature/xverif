  short_description: "Python NPI analysis, URG coverage export, and native-worker exclusion CSV/EL scripts"
  default_prompt: "Use $x-npi for Python pynpi waveform/protocol/design analysis; use fixed full64 URG summary for coverage reads and XML hierarchy expansion, and use exact handle_by_name plus request-pruned locator replay only for NPI exclusion and four-file CSV-to-EL operations through the bundled xcov.native worker. Coverage exclusion does not need pynpi_lifecycle or ConfigOpt. If licenses are constrained, prefer bsub/LSF and never silently fall back to local execution."
